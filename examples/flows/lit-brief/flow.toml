# The TOML view of flow.ocp.json beside it: the same flow, in tables. Loading this folder reads
# flow.ocp.json while it is here. Saving writes the view in a standard form, so comments are not kept.

id = "lit-brief"
version = 1
title = "Question to a one-page brief"
edges = [
  "question -> scout",
  "scout -> sources",
  "sources -> extract",
  "extract -> claims",
  "claims -> synthesize",
  "question -> synthesize",
  "synthesize -> brief",
  "brief -> critic",
  "claims -> critic",
  "critic -> verdict",
]

[[pieces]]
id = "scout"
role = "worker"
width = 1

[[pieces]]
id = "extract"
role = "worker"
width = 1

[[pieces]]
id = "synthesize"
role = "worker"
width = 1

[[pieces]]
id = "critic"
role = "reviewer"
width = 1

[[artifacts]]
id = "question"
kind = "other"

[[artifacts]]
id = "sources"
kind = "other"

[[artifacts]]
id = "claims"
kind = "other"

[[artifacts]]
id = "brief"
kind = "other"

[[artifacts]]
id = "verdict"
kind = "verdict"

[control]
budget_rounds = 2
rescue = "redo_usual"

[[control.gates]]
id = "g_extract"
after = "extract"
rule = "command:claims-check"
on_fail = "extract"

[[control.gates]]
id = "g_critic"
after = "critic"
rule = "review_approve"
on_fail = "synthesize"

[settings.scout]
harness = "api"
model = "claude-sonnet-5-5"
effort = "default"
context_policy = "fresh"

[settings.extract]
harness = "api"
model = "claude-opus-5-5"
effort = "high"
context_policy = "fresh"

[settings.synthesize]
harness = "api"
model = "gpt-6-astra"
effort = "high"
context_policy = "fresh"

[settings.critic]
harness = "api"
model = "claude-haiku-5-5"
effort = "default"
context_policy = "fresh"

[flow]
id = "lit-brief"
version = 1
title = "Question to a one-page brief"
hypothesis = "extract can run on Sonnet without hurting the brief; the critic adds little"

[flow.configuration]
source = "usual"

[flow.inputs]
ref = "questions.jsonl"
type = "research"
n = 20
ids = ["q01", "q02", "q03", "q04", "q05", "q06", "q07", "q08", "q09", "q10", "q11", "q12", "q13", "q14", "q15", "q16", "q17", "q18", "q19", "q20"]
holdout = ["q13", "q14", "q15", "q16", "q17", "q18", "q19", "q20"]

[flow.accept]
name = "quality>=0.7+claims-check"
definition = "quality at least 0.7 and the claims check passes"
requires = ["claims-check"]

[flow.accept.score]
name = "quality"
target = 0.7
better = "higher"
scale = "fraction"

[flow.objective]
kind = "cheapest_within_margin"
score = "quality"
margin = 0.1
reference = "base"

[[flow.judges]]
id = "j-claude"
kind = "model"
model = {id = "claude-sonnet-5-5"}
rubric = "rubric.md#v1"

[[flow.judges]]
id = "j-astra"
kind = "model"
model = {id = "gpt-6-astra"}
rubric = "rubric.md#v1"

[[flow.judges]]
id = "person"
kind = "person"
rate = 0.2

[flow.allow]
budgets = [1, 2, 3]

[flow.allow.pieces.extract]
models = [{id = "claude-sonnet-5-5"}, {id = "claude-haiku-5-5"}]

[flow.allow.pieces.synthesize]
efforts = ["medium", "high"]

[flow.allow.pieces.critic]
drop = true

[flow.allow.pieces.scout]
widths = [1, 2]
select = {harness = "api", model = {id = "claude-haiku-5-5"}}

[[flow.allow.merges]]
id = "extract+synthesize"
replace = ["extract", "synthesize"]
into = {id = "extract_synthesize", role = "worker"}
setting = {harness = "api", model = {id = "claude-opus-5-5"}, effort = "high", options = {prompt = "merged-v1"}}

[flow.ext]
"dev.loopmath.hypothesis_edits" = [{kind = "model", piece = "extract", value = {id = "claude-sonnet-5-5"}}, {kind = "drop", piece = "critic"}]

[document.producer]
name = "loopmath"
version = "0.4.0"

[document.producer.capabilities]
flow = true
configuration = true

[document.privacy]
profile = "metadata_only"
