id = "plan_implement_review"
version = 1
title = "Plan, implement, review"
edges = [
  "issue -> plan",
  "repo -> plan",
  "plan -> plan_doc",
  "issue -> implement",
  "repo -> implement",
  "plan_doc -> implement",
  "implement -> diff",
  "diff -> review",
  "issue -> review",
  "plan_doc -> review",
  "review -> verdict",
]

[[pieces]]
id = "plan"
role = "planner"
width = 1

[[pieces]]
id = "implement"
role = "implementer"
width = 1

[[pieces]]
id = "review"
role = "reviewer"
width = 1

[[artifacts]]
id = "issue"
kind = "issue"

[[artifacts]]
id = "repo"
kind = "repo"

[[artifacts]]
id = "plan_doc"
kind = "plan"

[[artifacts]]
id = "diff"
kind = "diff"

[[artifacts]]
id = "verdict"
kind = "verdict"

[control]
budget_rounds = 3
rescue = "redo_usual"

[[control.gates]]
id = "g_review"
after = "review"
rule = "review_approve"
on_fail = "implement"
