edges = [
  "issue -> plan",
  "repo -> plan",
  "plan -> plan_doc",
  "issue -> implement",
  "repo -> implement",
  "plan_doc -> implement",
  "implement -> diff",
]

[[pieces]]
id = "plan"
role = "planner"
width = 1

[[pieces]]
