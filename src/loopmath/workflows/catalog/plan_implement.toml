[[artifacts]]
id = "repo"
kind = "repo"

[[artifacts]]
id = "plan_doc"
kind = "plan"

[[artifacts]]
id = "diff"
kind = "diff"

[control]
budget_rounds = 1
rescue = "redo_usual"
