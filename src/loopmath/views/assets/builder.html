<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loopmath builder</title>
<link rel="stylesheet" href="/assets/base.css">
<style>
  textarea { width: 100%; min-height: 320px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; background: #fff; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  .err { color: var(--red); }
  pre { white-space: pre-wrap; margin: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1><span class="k">loopmath</span> builder</h1>
    <p class="lede" id="lede">Loading the recommendation...</p>
  </div>
  <div class="panel">
    <h2>Start from</h2>
    <div class="row">
      <select id="pick" aria-label="Start from a candidate"></select>
      <button id="load">Load</button>
    </div>
    <p class="muted small">A placeholder page: edit the configuration as JSON and press Estimate. The chosen design replaces this page.</p>
  </div>
  <div class="panel">
    <h2>Configuration</h2>
    <textarea id="cfg" spellcheck="false"></textarea>
    <div class="row"><button id="go" class="on">Estimate</button><span id="state" class="muted small"></span></div>
  </div>
  <div class="panel">
    <h2>Estimate</h2>
    <div class="stats" id="stats"></div>
    <pre id="out" class="mono"></pre>
  </div>
</div>
<script>
(function () {
  "use strict";
  var ctx = null;
  var $ = function (id) { return document.getElementById(id); };
  function usd(x) { return x == null ? "n/a" : "$" + Number(x).toFixed(2); }
  function pct(x) { return x == null ? "n/a" : Math.round(100 * x) + "%"; }
  function stat(value, name) {
    var d = document.createElement("div"); d.className = "stat";
    var b = document.createElement("b"); b.textContent = value;
    var s = document.createElement("span"); s.textContent = name;
    d.appendChild(b); d.appendChild(s); return d;
  }
  function show(res) {
    var stats = $("stats"); stats.textContent = "";
    if (!res.ok) {
      $("out").className = "mono err";
      $("out").textContent = (res.errors || []).join("\n");
      return;
    }
    var n = res.numbers;
    stats.appendChild(stat(pct(n.chance.mean), "chance of " + n.chance.of));
    stats.appendChild(stat(usd(n.run_cost_usd.mean), "run cost"));
    stats.appendChild(stat(usd(n.cost_per_accepted_usd.mean), "per accepted result"));
    stats.appendChild(stat(res.rank.by_cost_per_accepted + " of " + res.rank.of, "rank by cost per accepted result"));
    $("out").className = "mono";
    $("out").textContent = res.label + "  [" + res.config_id + "]\n" +
      (res.warnings && res.warnings.length ? "warnings: " + res.warnings.join("; ") + "\n" : "") +
      JSON.stringify(res, null, 1);
  }
  function estimate() {
    var body;
    try { body = { config: JSON.parse($("cfg").value) }; }
    catch (e) { show({ ok: false, errors: ["the configuration is not JSON: " + e.message] }); return; }
    $("state").textContent = "estimating...";
    var t0 = performance.now();
    fetch("/api/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (res) { $("state").textContent = Math.round(performance.now() - t0) + " ms"; show(res); })
      .catch(function (e) { $("state").textContent = ""; show({ ok: false, errors: [String(e)] }); });
  }
  function load() {
    var c = ctx.candidates[Number($("pick").value)];
    $("cfg").value = JSON.stringify(c.config, null, 1);
    estimate();
  }
  fetch("/api/context").then(function (r) { return r.json(); }).then(function (c) {
    ctx = c;
    $("lede").textContent = "Task: " + c.task.type + " in " + c.task.repo + ". Rule: " + c.rule.definition +
      ". Reference: " + c.reference.label + ". Fit " + c.fit.id + ".";
    var pick = $("pick"), start = 0;
    c.candidates.forEach(function (x, i) {
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = usd(x.numbers.cost_per_accepted_usd.mean) + " per accepted result: " + x.label;
      pick.appendChild(o);
      if (c.start && x.config.id === c.start.id) { start = i; }
    });
    pick.value = String(start);
    if (c.start && c.candidates[start].config.id !== c.start.id) {
      $("cfg").value = JSON.stringify(c.start, null, 1); estimate();
    } else { load(); }
  });
  $("load").addEventListener("click", load);
  $("go").addEventListener("click", estimate);
})();
</script>
</body>
</html>
