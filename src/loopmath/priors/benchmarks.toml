# Published benchmark results for the 12 current models (lane 11; layout D36, coverage D50).
# Generated by design/0.1/data/benchmarks/make_benchmarks.py from the pinned evidence file
# design/0.1/data/benchmarks/artificialanalysis-2026-09-23.json. Values are copied as published;
# a missing cell stays missing. Lane 5's belief.priors.benchmark_factors reads this file: success
# results become logit gaps to the reference model with variance 1 / (w p (1 - p)), w =
# benchmark_prior_weight (default 5). The first result for the reference model is the reference.

[[benchmark]]
id = "aa-terminal-bench-4.0"
title = "Terminal-Bench 4.0, run independently by Artificial Analysis"
metric = "pass@1 averaged over three repeats of 66 tasks, as a fraction"
kind = "success"
reference = "claude-opus-5"
reference_effort = "max"
harness = "mini-swe-agent (Artificial Analysis)"
url = "https://artificialanalysis.ai/evaluations/terminalbench-4-0"
note = "One harness for every model, so the gaps compare models rather than scaffolds. Variants without reasoning are left out (loopmath does not run them). Haiku 4.5 is the reasoning variant, which names no effort. Values are k of 198 task runs."

[[benchmark]]
id = "aa-terminal-bench-4.0-tokens"
title = "Tokens used to run Terminal-Bench 4.0, as published by Artificial Analysis"
metric = "total tokens for the whole evaluation (66 tasks x 3 repeats): input (with cached input) + answer + reasoning"
kind = "tokens"
reference = "claude-opus-5"
reference_effort = "max"
harness = "mini-swe-agent (Artificial Analysis)"
url = "https://artificialanalysis.ai/evaluations/terminalbench-4-0"
note = "D54: a log-ratio factor on the tokens head only, never converted to dollars. The same three streams for every model, so the ratio is like for like."

