# Rows checked on the provider pages on 2026-09-23 (loopmath 0.1.0, lane 02).
# Each source names its page and the date it was read; the tariff record
# written with every priced attempt takes its date from "checked YYYY-MM-DD".
#
# Anthropic (https://platform.claude.com/docs/en/about-claude/pricing): cache_write is the 1-hour write rate (2x input), as
#   for the rows above. Claude Code writes the 1-hour cache: 64.2M of 64.2M
#   cache-write tokens in 200 recent sessions on the build machine were 1h.
# OpenAI (https://developers.openai.com/api/docs/pricing and each model's
#   page): GPT-6 bills cache writes (1.25x input), but Codex reported 0
#   cache-write tokens in all 91 recent GPT-6 sessions on the build machine,
#   so that stream prices at 0 whatever the rate says. Prompts over 272K
#   input tokens bill 2x input and cache and 1.5x output for the whole
#   request; they are priced at the standard rate here. Both make a GPT-6
#   figure a floor, not an exact bill.
# ---------------------------------------------------------------------------

