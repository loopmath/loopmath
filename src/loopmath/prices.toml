# Provider price table, $/Mtok, as of 2026-08-31.
#
# SPEC amendment 1 (08-31, Analyst). This table is copied from
# the experiment repository's results/prices-2026-08-31.toml, which is the
# authoritative source. It replaces the SPEC section 5 example values, which
# were an Opus-4-era carryover and about 3x too high on opus.
#
# Anthropic rates DERIVED EXACTLY from billing data in attempts.jsonl
#   (least-squares on cost_usd ~ input + cache_read + cache_write + output;
#   fable residual $0.0000, opus/sonnet consistent with the 1 : 0.1 : 2 : 5
#   structure).
# OpenAI rates from published Aug-2026 pricing (the codex CLI reports no
#   cost_usd): sol cut $5/$30 to $4/$20 on 2026-08-21 (promo through about
#   Nov 21); luna cut roughly 80% on 2026-07-30; cached input is 10% of the
#   input rate on GPT-5.x; OpenAI does not charge for cache writes.
#
# CAVEAT, named here and printed in output, never hidden: GPT-5.6
#   long-context requests (over roughly 272k tokens) carry a surcharge
#   (sol $8/$30, terra $4/$18, luna $0.40/$1.80) that per-attempt records
#   cannot resolve. Those requests are priced at the standard rate, so any
#   GPT-5.6 figure here is a floor, not an exact bill.
#
# ONE DELIBERATE DEVIATION from a byte-for-byte copy, and the reason for it.
# The source file writes its GPT tables with unquoted keys, as [gpt-5.6-sol].
# A dot is a key separator in TOML, so that parses as a table `gpt-5` with
# children `6-sol`, `6-terra`, `6-luna` and `4`, and every GPT price silently
# disappears from a lookup by model name. Verified against tomllib before
# changing anything. Every table name here is therefore quoted, which is what
# makes the file mean what the source intended. Rates, source labels and
# as_of are otherwise reproduced exactly.

as_of = "2026-08-31"

